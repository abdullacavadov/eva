name: Phase 8 finalize patch

on:
  push:
    branches: [phase-8-desktop-controls]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply Phase 8 routing updates
        run: |
          python - <<'PY'
          from pathlib import Path

          tool_defs = Path("tool_defs.py")
          text = tool_defs.read_text(encoding="utf-8")
          old = '"description": "Sistem məlumatlarını alır: batareya vəziyyəti, CPU, RAM, disk, saat, tarix və şəbəkə bağlantısı.",'
          new = '"description": "Sistem məlumatlarını alır: batareya vəziyyəti, CPU, RAM, disk, saat, tarix və şəbəkə bağlantısı. Həmçinin Windows səs səviyyəsini və ekran parlaqlığını oxuya və artırıb-azalda bilər; volume/volume_up/volume_down/brightness/brightness_up/brightness_down sorğularından istifadə et.",'
          if old not in text:
              raise SystemExit("sys_info declaration marker not found")
          text = text.replace(old, new, 1)
          old = '"description": "Brauzerdə URL açır, Google-da axtarış edir və ya YouTube-da ilk nəticəni birbaşa oynadır.",'
          new = '"description": "Brauzerdə URL açır, Google-da axtarış edir, YouTube-da ilk nəticəni oynadır və iki məkan arasında Google Maps marşrutunu canlı trafik xəritəsi ilə açır. action: open_url | search | play_youtube | traffic; traffic üçün query-də başlanğıc -> təyinat ver.",'
          if old not in text:
              raise SystemExit("browser declaration marker not found")
          text = text.replace(old, new, 1)
          tool_defs.write_text(text, encoding="utf-8")

          main = Path("main.py")
          text = main.read_text(encoding="utf-8")
          old = "    ENABLE_CLAP_WAKE = False"
          new = '    ENABLE_CLAP_WAKE = str(os.getenv("EVA_CLAP_WAKE_ENABLED", "true")).strip().lower() not in {"0", "false", "no", "off"}'
          if old not in text:
              raise SystemExit("clap flag marker not found")
          main.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
      - name: Remove temporary workflow
        run: |
          rm .github/workflows/phase8_finalize_patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tool_defs.py main.py .github/workflows/phase8_finalize_patch.yml
          git commit -m "feat: finalize Phase 8 desktop controls and clap wake"
          git push
