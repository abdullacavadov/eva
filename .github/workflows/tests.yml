name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  # CI runner-də real mikrofon olmadığından wake listener audio stream açmamalıdır.
  EVA_CLAP_WAKE_ENABLED: "false"

jobs:
  pytest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install system dependencies
        run: sudo apt-get install -y portaudio19-dev xvfb

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run pytest
        run: xvfb-run -a python -m pytest -q
